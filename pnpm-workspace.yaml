packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  canvas: false
  electron: true
  esbuild: true
  ffmpeg-static: true
  tesseract.js: false

catalog:
  axios: ^1.17.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
minimumReleaseAgeExclude:
  - thinking-orbs@0.1.1
overrides:
  # ffmpeg-static 5.3.0 bundles an agent that fails Node 24's protocol check.
  ffmpeg-static>https-proxy-agent: 7.0.6
  vite: 'catalog:'
patchedDependencies:
  ffmpeg-static@5.3.0: patches/ffmpeg-static@5.3.0.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
