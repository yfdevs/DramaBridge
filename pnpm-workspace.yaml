packages:
  - packages/*

allowBuilds:
  # v13 ships portable N-API binaries; postinstall verifies them in Electron.
  better-sqlite3: false
  canvas: false
  electron: true
  # Only needed for the unused Squirrel target; this app packages Windows with NSIS.
  electron-winstaller: false
  esbuild: true
  ffmpeg-static: true
  tesseract.js: false

catalog:
  axios: ^1.17.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
minimumReleaseAgeExclude:
  - thinking-orbs@0.1.1
  - electron@44.9.3
overrides:
  # ffmpeg-static 5.3.0 bundles an agent that fails Node 24's protocol check.
  ffmpeg-static>https-proxy-agent: 7.0.6
  # electron-builder 26 uses the cache-mode API added after @electron/get 3.0.0.
  app-builder-lib>@electron/get: 3.1.0
  vite: 'catalog:'
patchedDependencies:
  ffmpeg-static@5.3.0: patches/ffmpeg-static@5.3.0.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
