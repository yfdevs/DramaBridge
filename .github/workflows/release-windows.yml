name: Build and release desktop

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_mac:
        description: Also build and release the macOS Apple Silicon version
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Use upstream downloads on GitHub-hosted runners rather than local mirrors.
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Record source commit
        id: source
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache FFmpeg binaries and license
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-static
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-ci-ffmpeg.mjs') }}

      - name: Prepare FFmpeg with download retries
        run: node scripts/prepare-ci-ffmpeg.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare next release version
        id: version
        run: node scripts/prepare-ci-release.mjs

      - name: Type check
        run: |
          pnpm exec tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsc -p tsconfig.node.json --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -r exec tsc --noEmit

      - name: Install shared Chromium runtime
        run: pnpm playwright:install-browsers

      - name: Build application
        run: pnpm build:app

      - name: Package Windows installer
        run: node scripts/package-electron-hoisted.mjs --win --x64 --publish never

      - name: Preserve release files
        uses: actions/upload-artifact@v4
        with:
          name: DramaBridge-Windows-${{ steps.version.outputs.version }}
          path: |
            release/${{ steps.version.outputs.version }}/*.exe
            release/${{ steps.version.outputs.version }}/*.blockmap
            release/${{ steps.version.outputs.version }}/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Preserve the shared release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-package-manifest
          path: package.json
          retention-days: 14

  mac:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.windows.outputs.version }}
      source_sha: ${{ needs.windows.outputs.source_sha }}

  release:
    needs: [windows, mac]
    if: ${{ always() && !cancelled() && needs.windows.result == 'success' && (needs.mac.result == 'success' || needs.mac.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      RELEASE_TAG: ${{ needs.windows.outputs.tag }}
      BUILD_MAC: ${{ needs.mac.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-package-manifest
          path: .cache/release-manifest

      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DramaBridge-*
          path: .cache/release-assets
          merge-multiple: true

      - name: Validate selected platform release files
        run: |
          for file in \
            "DramaBridge-Windows-$RELEASE_VERSION-Setup.exe" \
            "DramaBridge-Windows-$RELEASE_VERSION-Setup.exe.blockmap" \
            "latest.yml"; do
            test -s ".cache/release-assets/$file" || { echo "Missing release file: $file"; exit 1; }
          done
          if [ "$BUILD_MAC" = "true" ]; then
            for file in \
              "DramaBridge-Mac-$RELEASE_VERSION-arm64.dmg" \
              "DramaBridge-Mac-$RELEASE_VERSION-arm64.zip"; do
              test -s ".cache/release-assets/$file" || { echo "Missing release file: $file"; exit 1; }
            done
          fi

      - name: Commit shared version and tag
        run: |
          cp .cache/release-manifest/package.json package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$RELEASE_VERSION [skip ci]"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .cache/release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
